<!DOCTYPE html>
<html>
<head>
    <title>Bienvenido - GDL IA</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f9; }
        .card { text-align: center; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 500px; width: 90%; }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; }
        
        /* Estilo para el contenedor del buscador */
        .search-form { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }
        .search-input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; flex-grow: 1; outline: none; }
        .search-input:focus { border-color: #007bff; }

        .btn { 
            display: inline-block; padding: 12px 20px; margin: 5px;
            background: #007bff; color: white; text-decoration: none;
            border-radius: 8px; font-weight: bold; transition: 0.3s;
            border: none; cursor: pointer; font-size: 16px;
        }end
        .btn:hover { background: #0056b3; transform: translateY(-2px); }
        .btn-secundario { background: #6c757d; }
        .btn-secundario:hover { background: #495057; }
        
        .divider { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📍 Explorador GDL con IA</h1>
        <p>Escribe tu duda o selecciona una opción:</p>

        <form action="/mapa/" method="GET" class="search-form">
            <input type="text" name="q" class="search-input" placeholder="¿Qué quieres buscar en GDL?" required>
            <button type="submit" class="btn">Explorar</button>
        </form>

        <div class="divider"></div>

        <div style="display: flex; justify-content: center; flex-wrap: wrap;">
            <a href="/mapa/" class="btn">Ver el Mapa Completo</a>
            <a href="/hola/" class="btn btn-secundario">Saludo Hola</a>
        </div>
    </div>
</body>
</html>
